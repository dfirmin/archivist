[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "archivist"
dynamic = ["version"]  # from git tags: see docs/releasing.md
description = "Contract-driven document engine: engine-owned Claude Code agents author OKF bundles from target-owned contracts"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
archivist = "archivist.cli:main"

[tool.setuptools_scm]
# The version comes from git: exactly X.Y.Z at the commit tagged vX.Y.Z, a .devN version on
# every other commit. A build without git history (a Docker context without .git) gets a
# development version, which can never pass for a release.
version_file = "src/archivist/_version.py"
fallback_version = "0.0.0.dev0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
