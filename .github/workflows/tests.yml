# Offline tests on every pull request and on main. Live proof is separate: docs/testing.md.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the engine's version is computed from git tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # The Pi harness's plumbing tests run real pi processes against a scripted endpoint.
      - run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.0.4
      - run: python -m pytest -q
