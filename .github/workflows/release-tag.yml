# Tags a release when a release commit lands on main.
#
# A release commit sets `version` in pyproject.toml (and __version__ in src/archivist/__init__.py)
# to a release such as 0.3.0. Development versions (0.3.0.dev0) are never tagged. When the tag
# vX.Y.Z does not exist yet, this workflow runs the offline tests and creates it on that commit,
# so targets can pin `engine: vX.Y.Z`. Re-runs are harmless: an existing tag on the same commit is
# a no-op, and an existing tag on a different commit fails loudly (tags are never moved).
name: release-tag

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - src/archivist/__init__.py
      - .github/workflows/release-tag.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = open("src/archivist/__init__.py", encoding="utf-8").read()
          declared = re.search(r'__version__ = "([^"]+)"', init).group(1)
          if declared != version:
              raise SystemExit(f"pyproject.toml says {version} but __init__.py says {declared}")
          release = re.fullmatch(r"\d+\.\d+\.\d+(?:-rc\.\d+)?", version) is not None
          print(f"version={version}")
          print(f"tag=v{version}")
          print(f"release={'true' if release else 'false'}")
          PY

      - name: Skip development versions
        if: steps.version.outputs.release != 'true'
        run: echo "Version ${{ steps.version.outputs.version }} is a development version; nothing to tag."

      - name: Check whether the tag exists
        if: steps.version.outputs.release == 'true'
        id: existing
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged=$(git rev-parse "$tag^{commit}")
            if [ "$tagged" = "$GITHUB_SHA" ]; then
              echo "$tag already points at this commit."
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::$tag already exists on $tagged; tags are never moved. Bump the version instead."
              exit 1
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the offline tests
        if: steps.version.outputs.release == 'true' && steps.existing.outputs.exists == 'false'
        run: |
          pip install -e ".[dev]"
          python -m pytest -q

      - name: Create the tag
        if: steps.version.outputs.release == 'true' && steps.existing.outputs.exists == 'false'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "archivist $tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "Tagged $GITHUB_SHA as $tag."
