# Engine profile: the team, what each agent needs from a target, and how the conductor
# dispatches it. Engine-owned. A target picks or defines pipelines from these agents in
# contracts/target.yaml; it never adds an agent.
#
# Python reads this file for four things only (plus which agents are the planner and the
# extractor, the support agents an authoring run may spawn besides its stages):
#   - roster: the conductor's Agent(...) allowlist for the chosen pipeline;
#   - requires: which contracts the chosen pipeline needs (missing = the run refuses);
#   - dispatch: copied verbatim into the run plan the conductor follows;
#   - writes: the frontmatter fields a stage may change. A run whose every stage declares
#     `writes` is fenced: nothing else in knowledge/ may change (ADR 0004).
# The conductor, not Python, carries out the dispatch rules.
version: 1
coordinator: conductor
planner: intake-planner
# Splits documents of an intake class with `mode: extract` into topic extracts before planning
# (ADR 0006). Support, like the planner: in the roster only when the target's intake extracts.
extractor: extractor
default_pipeline: full

agents:
  intake-planner:
    optional: [intake, reference]

  extractor:
    optional: [intake, concept-types, reference]

  author:
    produces: true            # creates concepts from inbox documents; the entry stage of an inbox run
    requires: [concept-types, structures]
    optional: [intake, reference]
    dispatch:
      per: group
      description: "author-{group}"
      prompt: |
        Author these inbox documents, in this order:
        {documents}
      done_when: >-
        Each document has left the inbox, for sources/processed/ behind a concept or for
        sources/quarantine/ behind a quarantined draft. Record each concept path and each
        quarantined draft the author reports. Quarantined drafts go to no later stage.
      on_empty: >-
        The author returned without writing a concept or a quarantined draft while the
        documents are still in the inbox: retry once with description "author-{group}-retry"
        and this line in front of the same prompt: "The previous session stopped before
        writing. Write the concept, or quarantine what you cannot place, now and move each
        document out of the inbox." A second empty return fails the group.
      on_failure: fail-group

  enricher:
    requires: [concept-types, structures]
    optional: [reference]
    dispatch:
      per: concept
      description: "enrich-{concept}"
      prompt: "Enrich {concept_path}."
      done_when: "The result starts with `Enriched: yes` or `Enriched: no — <reason>`."
      on_failure: continue

  verifier:
    dispatch:
      per: concept
      description: "verify-{concept}"
      prompt: "Verify {concept_path} against its cited sources."
      done_when: The result reports restored losses, reconciled conflicts and removed unsupported passages.
      on_failure: stop-concept

  gap-agent:
    requires: [gap-kinds, concept-types]
    optional: [reference]
    writes: [okfx_gaps]
    dispatch:
      per: gap-kind
      parallel: true
      before: >-
        For every concept, including ones you think are unchanged: run `archivist prune-gaps
        "{concept_path}"` (it drops entries for kinds the contract no longer applies here and
        adds `okfx_gaps: []` when missing; never edit `okfx_gaps` yourself). Its `fleet` line
        is this concept's fleet: the enabled kinds whose `applies_to` holds the concept's type,
        narrowed to the run plan's `scope.kinds`. Spawn exactly those kinds, one gap-agent each,
        in one message; `fleet none` means no gap-agent for this concept.
      description: "gap-{kind}-{concept}"
      prompt: "Judge only kind {kind} on {concept_path}."
      done_when: Every kind returned present true or false.
      on_failure: >-
        Retry the failed kinds once, together, with a "-retry" description. A kind that still
        fails stops the concept: record `<concept> → gap-agent <kind> → <error>`.

  scorer:
    requires: [scoring, gap-kinds]
    writes: [okfx_confidence]
    dispatch:
      per: concept
      description: "score-{concept}"
      prompt: "Score {concept_path}."
      done_when: The result reports a score.
      on_failure: continue

# Engine pipelines. A target pipeline of the same name replaces one of these.
pipelines:
  full: [author, enricher, verifier, gap-agent, scorer]
  author-verify: [author, verifier]
  enrich: [enricher]
  gaps: [gap-agent, scorer]   # re-judge gaps on existing concepts, then re-score
  rescore: [scorer]           # re-score existing concepts after a scoring-contract change

# Enrichment methods a structure section may name in `enrich.method`. The enricher loads
# the listed skills; the contract says where the result goes.
enrichment_methods:
  code-logic:
    description: >-
      Read the SQL/ETL code behind the concept's entities and record filters, joins, derived
      fields and source-system divergences, each row citing a file at a commit.
    skills: [source-code-locator, implementation-logic]
