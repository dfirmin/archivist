# Concept types: every kind of document this bundle holds. Starter: one generic article.
# `type` is the exact OKF type string. Fields beyond OKF's own must start with okfx_.
version: 1
concept_types:
  knowledge-article:
    type: Knowledge Article
    description: One topic explained from the documents that describe it.
    authored: true                       # the author may create these from inbox documents
    # Two structures, so a rule picks one per document from what the document is. The author
    # records its choice as okfx_structure on the article; later stages read that.
    structures: [article, how-to]
    structure_rule: >-
      Use how-to when the document mainly tells the reader how to do something, step by step.
      Otherwise use article.
    path: "knowledge/articles/{title}.md"
    tags: [article]
    fields:
      okfx_owner:
        description: The team or person the source names as owner, if any.
        from: the source document body; leave unset when it names none
