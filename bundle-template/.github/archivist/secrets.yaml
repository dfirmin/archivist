# What the publish workflows need, per workflow. Engine-owned and machine-readable;
# .github/archivist/SECRETS.md is the human checklist for it.
#
# GitHub cannot create a secret without a value, so the scaffold lists them here instead.
# Each workflow refuses to run, and says which names are missing, until they are set.
#   secrets:    Settings > Secrets and variables > Actions > Secrets
#   variables:  Settings > Secrets and variables > Actions > Variables (or the workflow input of
#               the same meaning). "required: false" ones have a default or can be left out.
version: 1
workflows:
  publish-databricks:
    file: .github/workflows/publish-databricks.yml
    secrets:
      - name: DATABRICKS_HOST
        description: Workspace URL, for example https://adb-1234567890123456.7.azuredatabricks.net
      - name: DATABRICKS_TOKEN
        description: Personal access token (or a service principal token) allowed to write to the destination.
    variables:
      - name: DATABRICKS_PATH
        required: true
        description: Destination. /Volumes/<catalog>/<schema>/<volume>/<folder> for a volume, or a workspace folder such as /Workspace/Shared/knowledge.

  publish-confluence:
    file: .github/workflows/publish-confluence.yml
    secrets:
      - name: CONFLUENCE_URL
        description: Base URL the REST API lives under, without /rest/api. Data Center, for example https://confluence.example.com
      - name: CONFLUENCE_TOKEN
        description: Bearer token (a Personal Access Token) for a user who can create and edit pages in the space.
    variables:
      - name: CONFLUENCE_SPACE_KEY
        required: true
        description: Key of the space the pages are written to.
      - name: CONFLUENCE_PARENT_PAGE_ID
        required: false
        description: Id of the page new pages are created under. Without it they go to the space root.

  publish-sharepoint:
    file: .github/workflows/publish-sharepoint.yml
    secrets:
      - name: SHAREPOINT_TENANT_ID
        description: Microsoft Entra tenant (directory) id.
      - name: SHAREPOINT_CLIENT_ID
        description: Application (client) id of an app registration with Graph application access to the site.
      - name: SHAREPOINT_CLIENT_SECRET
        description: A client secret of that app registration.
    variables:
      - name: SHAREPOINT_SITE_URL
        required: true
        description: The site, for example https://contoso.sharepoint.com/sites/Knowledge
      - name: SHAREPOINT_LIBRARY
        required: false
        description: Document library name. Defaults to Documents.
      - name: SHAREPOINT_FOLDER
        required: false
        description: Folder inside the library. Defaults to knowledge.
      - name: SHAREPOINT_LOGIN_URL
        required: false
        description: Token endpoint host for a government cloud. Defaults to https://login.microsoftonline.com
      - name: SHAREPOINT_GRAPH_URL
        required: false
        description: Graph host for a government cloud. Defaults to https://graph.microsoft.com
