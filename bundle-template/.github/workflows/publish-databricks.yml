# Publish knowledge/ to Databricks: a Unity Catalog volume or a workspace folder.
#
# Ad hoc: Actions tab > publish-databricks > Run workflow. It publishes the branch you run it on.
# Set the secrets and the path first (see .github/archivist/SECRETS.md); "Dry run" needs
# neither the secrets nor network access and only lists what would be written.
#
# Seeded once by `archivist prepare-target`. After that this file is yours: the engine never
# overwrites it, so edit the runner section below for your network.
name: publish-databricks

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Destination: /Volumes/<catalog>/<schema>/<volume>/<folder> or a workspace folder. Blank uses the DATABRICKS_PATH repository variable."
        required: false
        type: string
      dry_run:
        description: "List what would be written; send nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-databricks
  cancel-in-progress: false

jobs:
  publish:
    # RUNNER (stub for the target to fill in): GitHub-hosted by default. For a self-hosted runner
    # replace the next line, e.g.  runs-on: [self-hosted, linux, x64]
    # The runner needs python3 and outbound HTTPS to the Databricks workspace.
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_PATH: ${{ inputs.path || vars.DATABRICKS_PATH }}
      # RUNNER NETWORK (stub): behind a proxy or a private CA, set these here, for example
      # HTTPS_PROXY: http://proxy.example.com:8080
      # SSL_CERT_FILE: /etc/ssl/certs/corporate-ca.pem
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets and settings
        run: python3 .github/archivist/publish.py databricks --check ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Publish knowledge/ to Databricks
        run: python3 .github/archivist/publish.py databricks ${{ inputs.dry_run && '--dry-run' || '' }}
