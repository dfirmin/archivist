# Engine target registry: one entry per onboarded knowledge repo.
# Everything about what a target contains — including the engine release it runs on
# (`engine:` in contracts/target.yaml) — lives in that repo's contracts/.
targets:
  - slug: sample
    name: Sample Data Warehouse
    description: Sample warehouse business-view knowledge (see examples/warehouse for its contracts)
    target_repo: https://github.com/example-org/sample-knowledge
    type: warehouse
    status: active
    auto_trigger: false

  - slug: policy-notes
    name: Policy Notes
    description: Plain-language policy summaries (see examples/minimal for its contracts)
    target_repo: https://github.com/example-org/policy-notes
    type: docs
    status: active
    auto_trigger: false

  - slug: archivist-knowledge-01
    name: Archivist Knowledge 01
    description: Live end-to-end test target for archivist, including publishing
    target_repo: https://github.com/dfirmin/archivist-knowledge-01
    type: test
    status: active
    auto_trigger: false
