# Archivist — Docker is the only runtime.
#
#   ./tests/run.sh                    # offline pytest suite
#   ./tests/smoke-claude.sh           # headless Claude Code + sub-agent spawn (live, credential-gated)
#   ./scripts/docker-run.sh --help    # any archivist subcommand

services:
  worker:
    build: .
    image: archivist:latest
    # Optional: the offline suite needs no credentials, so a fresh checkout or
    # worktree must not have to fabricate an empty .env just to run tests.
    env_file:
      - path: .env
        required: false
    environment:
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
      DOCKER_CONTAINER: "1"
      ANTHROPIC_BASE_URL: "https://litellm.example.com"
      CHILD_SESSION_TRANSCRIPT_DIR: "/out/transcripts"
    volumes:
      # Target clones and agent cwd — visible on the host (./out on the host).
      - "./out/workspace:/workspace"
      # Session transcripts survive the container.
      - "./out:/out"
